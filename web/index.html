<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Bottle Sort</title>
<style>
  :root {
    --bg: #454f80;
    --ink: #eef1fb;
    --muted: #aab2d8;
    --orange: #f07216;
    --green: #34a83a;
    --blue: #1f86c8;
    --dark: #2b2f45;
    --white: #f2f4fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 32rem; }
  h1 {
    margin: 0 0 .25rem;
    font-size: clamp(2rem, 9vw, 3rem);
    letter-spacing: -.02em;
  }
  .tag {
    margin: 0 0 2rem;
    color: var(--muted);
    font-size: .95rem;
    text-transform: uppercase;
    letter-spacing: .12em;
  }
  .bottles {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: .75rem;
    margin: 0 0 2rem;
  }
  .bottle {
    width: 2.25rem;
    border-radius: .4rem .4rem .6rem .6rem;
    background: rgba(255,255,255,.07);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
    overflow: hidden;
    display: flex;
    flex-direction: column-reverse;
  }
  .bottle.tall { height: 12rem; }
  .bottle.std  { height: 6rem; }
  .layer { flex: 1 0 25%; }
  .tall .layer { flex-basis: 12.5%; }
  p { color: var(--muted); }
  a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Bottle Sort</h1>
  <p class="tag">En construction</p>

  <div class="bottles" aria-hidden="true">
    <div class="bottle tall">
      <div class="layer" style="background:var(--orange)"></div>
      <div class="layer" style="background:var(--orange)"></div>
      <div class="layer" style="background:var(--orange)"></div>
      <div class="layer" style="background:var(--orange)"></div>
      <div class="layer" style="background:var(--orange)"></div>
    </div>
    <div class="bottle std">
      <div class="layer" style="background:var(--green)"></div>
      <div class="layer" style="background:var(--dark)"></div>
      <div class="layer" style="background:var(--orange)"></div>
    </div>
    <div class="bottle std">
      <div class="layer" style="background:var(--blue)"></div>
      <div class="layer" style="background:var(--white)"></div>
    </div>
    <div class="bottle std">
      <div class="layer" style="background:var(--dark)"></div>
    </div>
  </div>

  <p>
    Puzzle de tri de liquides colorés.
    Le jeu n'est pas encore développé — cette page valide la chaîne de publication.
  </p>
  <p>
    <a href="https://github.com/viruseb/bottlesort">Code et documentation sur GitHub</a>
  </p>
</main>
</body>
</html>
